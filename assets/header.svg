<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="mamCode - mamCode, Web and Mobile Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2f3a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#5eead4" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="290" fill="url(#bg)"/>
  <rect width="1200" height="290" fill="url(#dots)"/>
  <circle cx="1010" cy="60" r="220" fill="url(#glow)"/>
  <circle cx="90" cy="290" r="170" fill="url(#glow)" opacity="0.6"/>

  <!-- left content -->
  <text x="70" y="72" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="4" fill="#5eead4">INFORMATICS STUDENT  /  UNIVERSITAS MADURA</text>
  <text x="66" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="url(#name)">mamCode</text>
  <text x="70" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#ccfbf1">mamCode <tspan fill="#14b8a6">|</tspan> Web &amp; Mobile Developer</text>

  <g font-family="'Courier New', Consolas, monospace" font-size="17" fill="#99f6e4">
    <text x="70" y="240" opacity="0">&gt; membangun aplikasi web &amp; mobile dari nol
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="240" opacity="0">&gt; sistem informasi, dashboard, dan IoT
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="240" opacity="0">&gt; rapi, cepat, dan benar-benar dipakai
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.30;0.36;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- code window -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5s" repeatCount="indefinite"/>
    <rect x="770" y="52" width="360" height="190" rx="16" fill="#0b1220" fill-opacity="0.82" stroke="#14b8a6" stroke-opacity="0.45"/>
    <circle cx="796" cy="76" r="6" fill="#f87171"/>
    <circle cx="816" cy="76" r="6" fill="#fbbf24"/>
    <circle cx="836" cy="76" r="6" fill="#34d399"/>
    <text x="1106" y="80" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#64748b">dev.js</text>
    <g font-family="'Courier New', Consolas, monospace" font-size="16">
      <text x="796" y="116"><tspan fill="#5eead4">const</tspan><tspan fill="#e2e8f0"> dev </tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#e2e8f0"> {</tspan></text>
      <text x="820" y="144"><tspan fill="#e2e8f0">name: </tspan><tspan fill="#fbbf24">"mamCode"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="820" y="172"><tspan fill="#e2e8f0">stack: </tspan><tspan fill="#fbbf24">["Web","Mobile","IoT"]</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="820" y="200"><tspan fill="#e2e8f0">goal: </tspan><tspan fill="#fbbf24">"useful systems"</tspan></text>
      <text x="796" y="228" fill="#e2e8f0">};</text>
    </g>
  </g>
</svg>
